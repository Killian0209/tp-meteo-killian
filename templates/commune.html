{{define "commune"}}
{{template "header" "Liste Commune"}}

<form action="/commune/search" method="get">
  <input type="text" name="name" placeholder="Rechercher une Commune...">
  <button type="submit">Rechercher</button>
</form>

{{range .}}
  <a href="/commune?id={{.Code}}">
    <h2>{{.Name}}</h2>
    <h3>{{.Code}}</h3>
  </a>
{{else}}
  <p>Aucune Commune trouvée.</p>
{{end}}
{{template "footer"}}
{{end}}
